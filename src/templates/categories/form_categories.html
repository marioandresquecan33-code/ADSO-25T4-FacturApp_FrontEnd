{% extends 'layout.html' %}

{% block content %}
<div class="container my-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 650px;">
        <div class="card-header bg-dark text-white p-3 border-0 rounded-top">
            <h4 class="mb-0 fw-bold">
                <i class="bi bi-tags-fill text-warning"></i> 
                {{ 'Editar Categoría' if categoria else 'Registrar Nueva Categoría' }}
            </h4>
        </div>
        
        <div class="card-body p-4 text-dark">
            <p class="text-muted small mb-4">Defina el nombre y una breve descripción para clasificar los productos en el inventario.</p>
            
            <form action="{{ '/category/edit/' ~ categoria.id_categoria if categoria else '/category/new' }}" method="POST">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-semibold">Nombre de la Categoría <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-bookmark"></i></span>
                        <input type="text" class="form-control" id="nombre" name="nombre" value="{{ categoria.nombre if categoria else '' }}" placeholder="Ej. Tecnología, Papelería, Aseo..." required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-card-text"></i></span>
                        <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Detalles opcionales sobre los artículos de esta categoría...">{{ categoria.descripcion if categoria else '' }}</textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="/list_categories" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-warning text-dark px-4 fw-bold shadow-sm">
                        {{ 'Actualizar Categoría' if categoria else 'Guardar Categoría' }}
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
