{% extends 'layout.html' %}

{% block content %}
<div class="container my-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width: 900px;">
        <div class="card-header bg-dark text-white p-3 border-0 rounded-top d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold"><i class="bi bi-cart-check-fill text-success"></i> Nueva Factura / Punto de Venta</h4>
            <a href="/facturas" class="btn btn-outline-light btn-sm">Ver Historial</a>
        </div>

        <div class="card-body p-4 text-dark">
            {% if error %}
            <div class="alert alert-danger fw-semibold">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/factura/new" method="POST">
                <!-- Selección rápida de Cliente registrado -->
                <div class="row mb-4 bg-light p-3 rounded border">
                    <div class="col-md-4 mb-2">
                        <label class="form-label fw-semibold">Autocompletar Cliente</label>
                        <select id="select_cliente" class="form-select" onchange="cargarDatosCliente()">
                            <option value="">-- Seleccionar registrado --</option>
                            {% for c in clientes %}
                            <option value="{{ c.nombre }}" data-doc="{{ c.documento }}">{{ c.nombre }} ({{ c.documento }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label for="cliente_documento" class="form-label fw-semibold">Documento / NIT <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cliente_documento" name="cliente_documento" placeholder="Ej. 1020304050" required>
                    </div>
                    <div class="col-md-4 mb-2">
                        <label for="cliente_nombre" class="form-label fw-semibold">Nombre del Cliente <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="cliente_nombre" name="cliente_nombre" placeholder="Ej. Carlos Gómez" required>
                    </div>
                </div>

                <!-- Tabla dinámica de productos a vender -->
                <h5 class="fw-bold mb-3">Detalle de Productos</h5>
                <div class="table-responsive mb-3">
                    <table class="table table-bordered align-middle" id="tabla_items">
                        <thead class="table-secondary">
                            <tr>
                                <th style="width: 55%;">Producto (Stock disponible)</th>
                                <th style="width: 25%;">Cantidad</th>
                                <th style="width: 20%;" class="text-center">Quitar</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <select name="id_producto[]" class="form-select" required>
                                        <option value="" disabled selected>Seleccione un producto...</option>
                                        {% for p in productos %}
                                        <option value="{{ p.id_producto }}">
                                            {{ p.nombre_producto }} — ${{ "{:,.0f}".format(p.precio) }} (Disp: {{ p.stock }})
                                        </option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <input type="number" name="cantidad[]" class="form-control" min="1" value="1" required>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarFila(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm mb-4" onclick="agregarFila()">
                    <i class="bi bi-plus-circle"></i> Agregar otro producto
                </button>

                <div class="d-flex justify-content-end gap-2 border-top pt-3">
                    <a href="/" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm">
                        <i class="bi bi-check2-circle"></i> Emitir Factura y Descontar Stock
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function cargarDatosCliente() {
    const select = document.getElementById('select_cliente');
    const opcion = select.options[select.selectedIndex];
    if (opcion.value) {
        document.getElementById('cliente_nombre').value = opcion.value;
        document.getElementById('cliente_documento').value = opcion.getAttribute('data-doc');
    }
}

function agregarFila() {
    const tbody = document.querySelector('#tabla_items tbody');
    const nuevaFila = tbody.rows[0].cloneNode(true);
    nuevaFila.querySelector('select').selectedIndex = 0;
    nuevaFila.querySelector('input').value = 1;
    tbody.appendChild(nuevaFila);
}

function eliminarFila(boton) {
    const tbody = document.querySelector('#tabla_items tbody');
    if (tbody.rows.length > 1) {
        boton.closest('tr').remove();
    }
}
</script>
{% endblock %}
